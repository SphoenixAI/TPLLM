name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # python -m pip, not bare pip: on some images the bare executable
      # is bound to a different interpreter than `python`, which installs
      # the dependencies where the tests cannot see them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest tests/ -q

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # The layering is enforced, not documented. These run separately so
      # a boundary violation is obvious in the checks list rather than
      # buried in three thousand passing tests.
      - name: Architecture boundaries
        run: |
          python -m pytest \
            tests/test_architecture_boundaries.py \
            tests/test_persistence_architecture.py -q

  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      # Builds a wheel and inspects it: nothing private ships, the PEP
      # 561 marker and the recorded contracts do, versions agree, and no
      # credential is committed outside the test suite. Run separately so
      # "this is not publishable" is visible in the checks list rather
      # than buried in three thousand passing tests.
      - name: Release readiness
        run: python -m pytest tests/test_release_readiness.py -q

  offline-quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The README promises this works with no API key and no account.
      # If that stops being true, CI should say so.
      - name: Quickstart runs offline
        run: |
          python -m lltpm runtime ingest examples/evidence.json \
            --db /tmp/ci.db --organization demo
          python -m lltpm runtime verify --db /tmp/ci.db
          python -m lltpm runtime status --db /tmp/ci.db --organization demo
          python -m lltpm runtime replay --db /tmp/ci.db \
            --organization demo --publish
          python -m lltpm runtime export --db /tmp/ci.db \
            --organization demo --what decisions > /dev/null

      # Following has to terminate and has to stay read-only. A loop
      # that hangs in CI is better found here than on a laptop.
      - name: Following the journal terminates and changes nothing
        run: |
          python -m lltpm runtime journal --db /tmp/ci.db \
            --follow --start 1 --poll-seconds 0.1 --idle-timeout 1
          python -m lltpm runtime verify --db /tmp/ci.db

      # The integration path offline: everything except the two commands
      # that touch the network. `verify` and `record` are deliberately
      # not run here — a build that depended on GitHub's live API would
      # fail for reasons that are not about this code.
      - name: Integrations work offline
        run: |
          python -m lltpm integrations sources
          python -m lltpm integrations normalize \
            tests/fixtures/github/pull_requests.json \
            --kind pull_request --repository acme/atlas-service \
            --project atlas --output /tmp/envelopes.json
          python -c "
          import json, pathlib
          envelopes = json.loads(pathlib.Path('/tmp/envelopes.json').read_text())
          assert envelopes, 'no evidence was produced'
          assert all(e['idempotency_key'] for e in envelopes)
          assert all(e['observed_at'] < e['received_at'] for e in envelopes), (
              'reality time must precede knowledge time'
          )
          print(f'{len(envelopes)} envelope(s) normalized offline')
          "

      - name: Structured logs are machine-readable
        run: |
          python -m lltpm runtime --log-level info --log-format json \
            replay --db /tmp/ci.db --organization demo 2> /tmp/ci.log
          python -c "
          import json, pathlib, sys
          lines = [
              line for line in
              pathlib.Path('/tmp/ci.log').read_text().splitlines()
              if line.startswith('{')
          ]
          assert lines, 'no structured log lines were emitted'
          for line in lines:
              json.loads(line)
          assert any(
              json.loads(line).get('execution_mode') == 'replay'
              for line in lines
          ), 'replay lines must say so'
          print(f'{len(lines)} structured log line(s) parsed')
          "
