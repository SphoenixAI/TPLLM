name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # python -m pip, not bare pip: on some images the bare executable
      # is bound to a different interpreter than `python`, which installs
      # the dependencies where the tests cannot see them.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,openai,dashboard]" build httpx

      - name: Test
        run: python -m pytest tests/ -q

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,openai,dashboard]" build httpx

      # The layering is enforced, not documented. These run separately so
      # a boundary violation is obvious in the checks list rather than
      # buried in three thousand passing tests.
      - name: Architecture boundaries
        run: |
          python -m pytest \
            tests/test_architecture_boundaries.py \
            tests/test_persistence_architecture.py -q

  release-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,openai,dashboard]" build httpx

      # Builds a wheel and inspects it: nothing private ships, the PEP
      # 561 marker and the recorded contracts do, versions agree, and no
      # credential is committed outside the test suite. Run separately so
      # "this is not publishable" is visible in the checks list rather
      # than buried in three thousand passing tests.
      - name: Release readiness
        run: python -m pytest tests/test_release_readiness.py -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history scan needs history. A shallow clone would make
          # it report a confident zero over one commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,openai,dashboard]" build httpx detect-secrets \
                                pip-audit cyclonedx-bom

      # Adversarial and boundary tests. Separate from the main suite so
      # "the auth surface changed" is visible in the checks list rather
      # than buried in four thousand passing tests.
      - name: Security tests
        run: |
          python -m pytest \
            tests/test_auth_adversarial.py \
            tests/test_provider_security.py \
            tests/test_dashboard_security.py \
            tests/test_release_readiness.py -q

      - name: Secret scan over the whole history
        run: python scripts/scan_history.py

      - name: Dependency vulnerabilities, per extra
        run: python scripts/audit_dependencies.py

      - name: Generate the SBOM
        run: python scripts/generate_sbom.py -o sbom.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: supply-chain
          path: sbom.json
          if-no-files-found: warn

  offline-quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      # The README promises this works with no API key and no account.
      # If that stops being true, CI should say so.
      - name: Quickstart runs offline
        run: |
          python -m tpllm runtime ingest examples/evidence.json \
            --db /tmp/ci.db --organization demo | tee /tmp/ingest.txt
          python -m tpllm runtime journal --db /tmp/ci.db \
            | tee /tmp/journal.txt
          python -m tpllm runtime verify --db /tmp/ci.db
          python -m tpllm runtime anchor --db /tmp/ci.db > /dev/null
          python -m tpllm runtime status --db /tmp/ci.db --organization demo
          python -m tpllm runtime coverage > /dev/null
          python -m tpllm runtime replay --db /tmp/ci.db \
            --organization demo | tee /tmp/replay.txt
          python -m tpllm runtime snapshot --db /tmp/ci.db \
            --organization demo
          python -m tpllm runtime replay --db /tmp/ci.db \
            --organization demo --publish
          python -m tpllm runtime export --db /tmp/ci.db \
            --organization demo --what decisions > /dev/null

      # The README quotes this output. A quoted example that no longer
      # matches the program is worse than no example, so the specific
      # claims it makes are asserted rather than the commands merely
      # being run.
      - name: The quickstart says what the README says it says
        run: |
          python - <<'PY'
          import pathlib
          ingest = pathlib.Path('/tmp/ingest.txt').read_text()
          journal = pathlib.Path('/tmp/journal.txt').read_text()
          replay = pathlib.Path('/tmp/replay.txt').read_text()

          # It names which evidence moved the intelligence.
          assert 'because' in ingest, ingest
          # A probability move never travels without its confidence.
          assert 'P(blocker_persisted)' in ingest, ingest
          assert 'confidence' in ingest, ingest
          # Most passes are routed below a human interrupt.
          assert 'attention: async_information' in ingest, ingest
          # Reality time is the time of the fact, not of the run.
          assert '2026-10-19' in journal, journal
          # Replay fences external effects and counts what it fenced.
          assert 'Suppressed' in replay, replay
          print('the README\'s quoted claims still hold')
          PY

      # Following has to terminate and has to stay read-only. A loop
      # that hangs in CI is better found here than on a laptop.
      - name: Following the journal terminates and changes nothing
        run: |
          python -m tpllm runtime journal --db /tmp/ci.db \
            --follow --start 1 --poll-seconds 0.1 --idle-timeout 1
          python -m tpllm runtime verify --db /tmp/ci.db

      # The integration path offline: everything except the two commands
      # that touch the network. `verify` and `record` are deliberately
      # not run here — a build that depended on GitHub's live API would
      # fail for reasons that are not about this code.
      - name: Integrations work offline
        run: |
          python -m tpllm integrations sources
          # Exactly as the README shows it, table output and all.
          python -m tpllm integrations normalize \
            tests/fixtures/github/pull_requests.json \
            --kind pull_request --repository acme/atlas-service \
            --project atlas | tee /tmp/normalize.txt
          grep -q '2026-02-25' /tmp/normalize.txt
          python -m tpllm integrations normalize \
            tests/fixtures/github/pull_requests.json \
            --kind pull_request --repository acme/atlas-service \
            --project atlas --output /tmp/envelopes.json
          python -c "
          import json, pathlib
          envelopes = json.loads(pathlib.Path('/tmp/envelopes.json').read_text())
          assert envelopes, 'no evidence was produced'
          assert all(e['idempotency_key'] for e in envelopes)
          assert all(e['observed_at'] < e['received_at'] for e in envelopes), (
              'reality time must precede knowledge time'
          )
          print(f'{len(envelopes)} envelope(s) normalized offline')
          "

      - name: Structured logs are machine-readable
        run: |
          python -m tpllm runtime --log-level info --log-format json \
            replay --db /tmp/ci.db --organization demo 2> /tmp/ci.log
          python -c "
          import json, pathlib, sys
          lines = [
              line for line in
              pathlib.Path('/tmp/ci.log').read_text().splitlines()
              if line.startswith('{')
          ]
          assert lines, 'no structured log lines were emitted'
          for line in lines:
              json.loads(line)
          assert any(
              json.loads(line).get('execution_mode') == 'replay'
              for line in lines
          ), 'replay lines must say so'
          print(f'{len(lines)} structured log line(s) parsed')
          "
