# LLTPM Docker Compose — local development and testing
version: "3.9"

services:
  # Main LLTPM dashboard and API
  lltpm:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - lltpm-data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLTPM_MODEL=${LLTPM_MODEL:-claude-opus-4-6}
      - LLTPM_DATA_DIR=/data
      # Optional integrations
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-lltpm@example.com}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - VOICE_BACKEND=${VOICE_BACKEND:-system}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from lltpm.config import LLTPMConfig; print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # CLI mode — interactive chat
  lltpm-cli:
    build: .
    profiles: ["cli"]
    volumes:
      - lltpm-data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LLTPM_DATA_DIR=/data
    entrypoint: ["lltpm", "chat"]
    stdin_open: true
    tty: true

volumes:
  lltpm-data:
    driver: local
