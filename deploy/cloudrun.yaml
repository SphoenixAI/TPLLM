# Google Cloud Run service definition for TPLLM
# Deploy with: gcloud run services replace deploy/cloudrun.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: tpllm
  annotations:
    run.googleapis.com/description: "AI Technical Program Manager"
    run.googleapis.com/launch-stage: BETA
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 10
      timeoutSeconds: 300
      serviceAccountName: tpllm-sa@PROJECT_ID.iam.gserviceaccount.com
      containers:
        - image: gcr.io/PROJECT_ID/tpllm:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "2"
              memory: 1Gi
          env:
            - name: TPLLM_DATA_DIR
              value: /data
            # Offline/dashboard operation needs no model credentials.
            # For agent use, choose a provider and model, then add its API
            # key through Secret Manager (ANTHROPIC_API_KEY or OPENAI_API_KEY).
            - name: TPLLM_PROVIDER
              value: ""
            - name: TPLLM_MODEL
              value: ""
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir:
            sizeLimit: 500Mi
