[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lltpm"
version = "0.41.0"
description = "AI-powered Technical Program Manager agent that replaces meetings with insight"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sphoenix" }]
keywords = [
    "technical-program-management",
    "ai-agent",
    "organizational-intelligence",
    "event-sourcing",
    "bitemporal",
    "scenario-analysis",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Office/Business :: Scheduling",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=0.45.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "click>=8.0",
    "python-dateutil>=2.8",
    "PyJWT>=2.11.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
integrations = [
    "PyGithub>=2.0",
    "jira>=3.0",
    "slack-sdk>=3.40.0",
    "slack-bolt>=1.27.0",
    "google-auth>=2.0",
    "google-api-python-client>=2.0",
]
email = [
    "sendgrid>=6.0",
]
voice = [
    "chatterbox-tts>=0.1",
    "piper-tts>=1.0",
    "kokoro>=0.9",
    "soundfile>=0.12",
]
openai = [
    "openai>=1.0",
]
pdf = [
    "weasyprint>=61.0",
]
dashboard = [
    "fastapi>=0.133.0",
    "uvicorn>=0.30.0",
]
all = [
    "lltpm[integrations,email,openai,dashboard]",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/SphoenixAI/LLTPM"
Repository = "https://github.com/SphoenixAI/LLTPM"
Issues = "https://github.com/SphoenixAI/LLTPM/issues"
Changelog = "https://github.com/SphoenixAI/LLTPM/blob/main/CHANGELOG.md"

[project.scripts]
lltpm = "lltpm.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/lltpm"]
# PEP 561: the package is annotated throughout, so say so — without this
# marker a consumer's type checker ignores every annotation here.
artifacts = ["src/lltpm/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
